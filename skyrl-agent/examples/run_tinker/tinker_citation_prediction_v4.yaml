agent_cls: skyrl_agent.agents.citation_prediction_v4_raw.CitationPredictionV4RawAgent

task: skyrl_agent.tasks.citation_prediction_v4.utils.CitationPredictionV4RawTask

tools: []

data:
  data_source_key: data_source

generator:
  infer_backend: tinker
  backend_config: null
  num_trajectories: 30
  max_iterations: 17
  max_prompt_length: 45000
  sampling_params:
    temperature: 0.6
    top_p: 1.0
    max_tokens: 4096
  val_config:
    num_trajectories: 1
    sampling_params:
      temperature: 0.0
      top_p: 1.0
      max_tokens: 4096
  remove_think_tokens: false
  vision_is_active: false
  qwen3_enable_thinking: false
  qwen3_acc_thinking: false
  profile_tools: true
  debug_log: false
  enable_turn_reminder: false
  early_step_threshold: 3

dispatcher:
  type: async_batch
  max_parallel_agents: 64
  max_eval_parallel_agents: 64
