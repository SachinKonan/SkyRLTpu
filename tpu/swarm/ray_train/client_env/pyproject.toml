[project]
name = "skyrl-ray-training-client"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "chz>=0.3",
    "ray[client]==2.58.0",
    "tinker==0.22.7",
    "torch==2.10.0+cpu",
    "transformers==5.8.0",
    "numpy>=1.24",
    "submitit>=1.5",
    "hydra-core>=1.3",
    "wandb>=0.23",
    "tiktoken>=0.12",
    "safetensors>=0.4",
    "huggingface-hub>=0.36",
    "datasets>=2.14",
    "tqdm>=4.65",
    "cloudpickle>=3.0",
    "fsspec>=2024.1",
    "python-dotenv>=1.0",
    "termcolor>=3.3.0",
    "cvxpy>=1.7.4",
    "scipy>=1.15.3",
    "shapely>=2.0",
    "numba>=0.60",
    "scikit-learn>=1.4",
    "setuptools==81.0.0",
    "wheel==0.45.1",
]

[tool.uv]
package = false
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
