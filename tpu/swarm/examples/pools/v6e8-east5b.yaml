# Pool tpuswarm-v6e8-east5b. Live target 18 workers (2026-10-05). Resize with
# `sky jobs pool apply -p tpuswarm-v6e8-east5b --workers N` and update this file to match;
# re-applying a stale file resets the pool to the count written here.
# Ten single-host v6e-8 slices in us-east5-b (created 2026-09-23). Sized by the zone
# slot cap: 50 queued resources shared with other users (~28 theirs) and our v6e-32
# pool (10), so 10 is the most that fits. Caches are the us-east5 originals.
# Set all three worker-count fields together.
pool:
  workers: 18
  min_workers: 18
  max_workers: 18
  queue_length_threshold: 1
  upscale_delay_seconds: 60
  downscale_delay_seconds: 1200

resources:
  cloud: gcp
  region: us-east5
  zone: us-east5-b
  accelerators: tpu-v6e-8
  accelerator_args:
    gcp_queued_resource: true
    runtime_version: v2-alpha-tpuv6e
  use_spot: true
  disk_size: 150

envs:
  TPUSWARM_SKYRL_BUNDLE_URL: gs://sk7524-tinker-tpu-us-east5/code-bundles/tpuswarm-skyrl-v6e-capacity-20260908-v1.tar.gz
  ZONE: us-east5-b

  # Single-host slice: jobs own their own TP/engine layout. Only the
  # region-local persistent-state prefixes are shared with the v6e-32 pool.
  TUNIX_MAXTEXT_CKPT_CACHE_GCS: gs://sk7524-tinker-tpu-us-east5/skyrl-maxtext-ckpts
  HF_CACHE_GCS: gs://sk7524-tinker-tpu-us-east5/hf-cache-qwen35-v1

setup: |
  set -uo pipefail
  setup_script="/tmp/tpuswarm-pool-setup.$$.sh"
  cat >"$setup_script" <<'TPUSWARM_POOL_SETUP'
  set -euo pipefail
  wait_for_apt() {
    local waited=0
    while sudo fuser /var/lib/dpkg/lock-frontend /var/lib/dpkg/lock /var/cache/apt/archives/lock >/dev/null 2>&1; do
      if [ "$waited" -ge 600 ]; then return 1; fi
      sleep 5
      waited=$((waited + 5))
    done
  }
  if ! { command -v git && command -v tmux && command -v g++; } >/dev/null 2>&1; then
    wait_for_apt
    sudo apt-get update -y
    wait_for_apt
    sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
      git curl tmux python3 python3-venv python3-pip build-essential
  fi
  command -v uv >/dev/null 2>&1 || curl -LsSf https://astral.sh/uv/install.sh | sh
  export PATH="$HOME/.local/bin:$PATH"

  root="$HOME/SkyRLTpu-tpuswarm"
  generation=$(gcloud storage objects describe "$TPUSWARM_SKYRL_BUNDLE_URL" \
    --format='value(generation)')
  test -n "$generation"
  bundles="$HOME/.cache/tpuswarm/bundles"
  destination="$bundles/$generation"
  mkdir -p "$bundles"
  if [ ! -d "$destination" ]; then
    archive=$(mktemp /tmp/tpuswarm-skyrl.XXXXXX.tar.gz)
    staging=$(mktemp -d "$bundles/.extract.XXXXXX")
    trap 'rm -f -- "$archive"; rm -rf -- "$staging"' EXIT
    gcloud storage cp "$TPUSWARM_SKYRL_BUNDLE_URL" "$archive"
    tar -xzf "$archive" -C "$staging"
    test -r "$staging/tpu/swarm/run_qwen35_v6e32_grpo.sh"
    test -r "$staging/tpu/swarm/prepare_qwen35_v6e32.sh"
    test -r "$staging/tpu/jobman/cell_worker.sh"
    test -f "$staging/third_party/TPUSwarm/pyproject.toml"
    test -f "$staging/.tpuswarm-bundle-manifest"
    mv "$staging" "$destination"
    rm -f -- "$archive"
    trap - EXIT
  fi
  if [ -e "$root" ] && [ ! -L "$root" ]; then
    echo "$root exists and is not a TPUSwarm-managed symlink" >&2
    exit 1
  fi
  ln -sfn "$destination" "$root"
  export SKYRL_REPO_DIR="$root"
  export TPUSWARM_BUNDLE_GENERATION="$generation"

  # Pool readiness means capacity and code are available, not that a model
  # has loaded. Submitted jobs own role caches, trainer and inference setup.
  node_count=$(printf '%s\n' "$SKYPILOT_SETUP_NODE_IPS" | awk 'NF' | wc -l)
  if [ "$node_count" -ne 1 ]; then
    echo "v6e-8 is a single TPU VM; SkyPilot supplied $node_count" >&2
    exit 2
  fi
  mkdir -p "$HOME/.ssh" "$HOME/skyrl-logs" "$HOME/skyrl-runs"
  chmod 700 "$HOME/.ssh"
  echo "v6e-8 pool rank $SKYPILOT_SETUP_NODE_RANK ready with bundle generation $generation"
  TPUSWARM_POOL_SETUP

  setup_attempt=0
  setup_retry_seconds="${TPUSWARM_SETUP_RETRY_SECONDS:-60}"
  while true; do
    setup_attempt=$((setup_attempt + 1))
    echo "[tpuswarm setup] rank $SKYPILOT_SETUP_NODE_RANK attempt $setup_attempt"
    if bash "$setup_script"; then
      break
    else
      setup_rc=$?
      echo "[tpuswarm setup] rank $SKYPILOT_SETUP_NODE_RANK attempt $setup_attempt failed with rc=$setup_rc; retaining the TPU and retrying in ${setup_retry_seconds}s" >&2
    fi
    sleep "$setup_retry_seconds"
  done
