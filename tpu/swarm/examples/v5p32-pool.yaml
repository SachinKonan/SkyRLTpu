# Apply from the repository root. Three complete v5p-32 slices are requested;
# configure target_workers=3 and recovery_reserve=1 in TPUSwarm.
pool:
  workers: 3
  min_workers: 3
  max_workers: 8
  queue_length_threshold: 1
  upscale_delay_seconds: 60
  downscale_delay_seconds: 1200

resources:
  cloud: gcp
  accelerators: tpu-v5p-32
  use_spot: true

envs:
  TPUSWARM_SKYRL_BUNDLE_URL: gs://sk7524-tinker-tpu-us-east5/code-bundles/tpuswarm-skyrl-qwen35-v6e32-v1.tar.gz

setup: |
  set -uo pipefail
  setup_script="/tmp/tpuswarm-pool-setup.$$.sh"
  cat >"$setup_script" <<'TPUSWARM_POOL_SETUP'
  set -euo pipefail
  root="$HOME/SkyRLTpu-tpuswarm"
  generation=$(gcloud storage objects describe "$TPUSWARM_SKYRL_BUNDLE_URL" \
    --format='value(generation)')
  test -n "$generation"
  bundles="$HOME/.cache/tpuswarm/bundles"
  destination="$bundles/$generation"
  mkdir -p "$bundles"
  if [ ! -d "$destination" ]; then
    archive=$(mktemp /tmp/tpuswarm-skyrl.XXXXXX.tar.gz)
    staging=$(mktemp -d "$bundles/.extract.XXXXXX")
    trap 'rm -f -- "$archive"; rm -rf -- "$staging"' EXIT
    gcloud storage cp "$TPUSWARM_SKYRL_BUNDLE_URL" "$archive"
    tar -xzf "$archive" -C "$staging"
    test -r "$staging/tpu/swarm/run_erdos_min_overlap.sh"
    test -f "$staging/third_party/TPUSwarm/pyproject.toml"
    test -f "$staging/.tpuswarm-bundle-manifest"
    mv "$staging" "$destination"
    rm -f -- "$archive"
    trap - EXIT
  fi
  if [ -e "$root" ] && [ ! -L "$root" ]; then
    echo "$root exists and is not a TPUSwarm-managed symlink" >&2
    exit 1
  fi
  ln -sfn "$destination" "$root"
  TPUSWARM_POOL_SETUP

  setup_attempt=0
  setup_retry_seconds="${TPUSWARM_SETUP_RETRY_SECONDS:-60}"
  while true; do
    setup_attempt=$((setup_attempt + 1))
    echo "[tpuswarm setup] rank $SKYPILOT_SETUP_NODE_RANK attempt $setup_attempt"
    if bash "$setup_script"; then
      break
    else
      setup_rc=$?
      echo "[tpuswarm setup] rank $SKYPILOT_SETUP_NODE_RANK attempt $setup_attempt failed with rc=$setup_rc; retaining the TPU and retrying in ${setup_retry_seconds}s" >&2
    fi
    sleep "$setup_retry_seconds"
  done
