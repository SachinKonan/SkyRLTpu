name: stageH-m-on-qpwc

Stage H: muse on the BEST qwen tree. The PUCT tree is seeded with the top-48 of stageC-pwc-n
# snapshot 12 (qwen centered, best 0.380857586); muse carries its own best weights
# (stageB-m-pw-n step 11) with a fresh optimizer and keeps its best objective (piecewise LOO).
# This is the fair rerun of meta-wt16-carry-g0-muse (0.380858715), which was seeded from the qwen
# GRPO tree (best 0.380859355) -- 1.77e-6 worse at the top than the qwen we actually have.
# (16x32, LR 4e-5, elite 2).
# piecewise_valid_entropic: A = (r - mean r) + alpha*(w - 1)*[valid]; GRPO carries validity,
# the one-bit entropic LOO weight ranks the valid cluster only (beta solved on that subset).
# One complete four-host tpu-v5p-32 slice from pool tpuswarm-v5p32-east5a-erdos:
# rank 0 = trainer + client + grader Ray head, ranks 1-3 = vLLM engines
# (cell_worker.sh per-model defaults; CELL prefix selects the model).
# Seeded start: puct_sampler_step_000000.json must be staged in GCS_RUN before launch;
# META_SEED_ONLY=1 makes the staged seed the only legitimate snapshot while 0 rows are banked.

resources:
  cloud: gcp
  region: us-east5
  zone: us-east5-a
  accelerators: tpu-v5p-32
  accelerator_args:
    gcp_queued_resource: true
    runtime_version: v2-alpha-tpuv5
  use_spot: true
  disk_size: 150
  job_recovery:
    strategy: FAILOVER
    max_restarts_on_errors: 3
    recover_on_exit_codes: [33, 34]

envs:
  PROJECT: vision-mix
  ZONE: us-east5-a
  REMOTE_USER: gcpuser
  SKYRL_REPO_DIR: /home/gcpuser/SkyRLTpu-tpuswarm
  TPUSWARM_SKYRL_BUNDLE_URL: gs://sk7524-tinker-tpu-us-east5/code-bundles/tpuswarm-skyrl-v5p32-cells-v23.tar.gz
  TPUSWARM_BUNDLE_ID: v5p32-cells-v23-m-on-qpwc

  CELL: m-pw-n
  RUN_DIR_NAME: stageH-m-on-qpwc
  EXPERIMENT_NAME: stageH-m-on-qpwc
  GCS_RUN: gs://sk7524-tinker-tpu-us-east5/skyrl-runs/stageH-m-on-qpwc
  # Every rank installs the same bundle generation in `run`, so the head must
  # not rsync its worktree to the engine hosts (that SSH sync corrupted live).
  CELL_START_VLLM: "1"
  CELL_SYNC_SKYRL: "0"

  # Seeded generation: while nothing is banked the staged step-0 seed is the ONLY legitimate
  # snapshot (launch_cell.sh META_SEED_ONLY guard) -- a cold tree would outgrow it and win the
  # snapshot ranking forever.
  META_SEED_ONLY: "1"
  # Weights carry: muse's own best gen-0 LoRA, fresh optimizer.
  META_INIT_STATE_PATH: tinker://model_df2f51fc/weights/000011

  TTD_ENV: erdos_min_overlap
  TTD_ADV_ESTIMATOR: piecewise_valid_entropic
  TTD_ELITE_SLOTS: "2"
  GROUPS_PER_BATCH: "16"
  GROUP_SIZE: "32"
  NUM_EPOCHS: "15"
  LEARNING_RATE: "4e-5"
  LORA_RANK: "32"
  KL_PENALTY_COEF: "0"
  TTD_RESTART_RATIO: "0"
  TTD_CROSS_WEIGHT: "0"
  TTD_KL_MEASURE_EVERY: "0"
  TTD_LEAGUE_PIPELINE: "1"
  TTD_ALLOW_SINGLE_MEMBER: "1"
  TTD_SAMPLING_PROGRESS_TIMEOUT: "0"
  EVAL_TIMEOUT: "1100"
  WANDB_MODE: offline

  MONITOR_INTERVAL_SECONDS: "30"
  SYNC_EVERY_SECONDS: "300"
  TINKER_FAILURE_LIMIT: "4"
  # The local SkyRL Tinker-compatible API is unauthenticated; the upstream
  # client only requires the variable to be nonempty. Passed explicitly into
  # the tmux command because a reused tmux server keeps its creator's env.
  TINKER_API_KEY: tml-local-skyrl-no-auth
  TINKER_BASE_URL: http://127.0.0.1:8000
  EXTRA_TTD_ENV: TINKER_API_KEY=tml-local-skyrl-no-auth TTD_ADV_PIECEWISE_ALPHA=1.0

run: |
  set -euo pipefail
  export PATH="$HOME/.local/bin:$PATH"
  generation=$(gcloud storage objects describe "$TPUSWARM_SKYRL_BUNDLE_URL" \
    --format='value(generation)')
  test -n "$generation"
  bundles="$HOME/.cache/tpuswarm/bundles"
  destination="$bundles/$generation"
  mkdir -p "$bundles"
  if [ ! -d "$destination" ]; then
    archive=$(mktemp /tmp/tpuswarm-skyrl.XXXXXX.tar.gz)
    staging=$(mktemp -d "$bundles/.extract.XXXXXX")
    trap 'rm -f -- "$archive"; rm -rf -- "$staging"' EXIT
    gcloud storage cp "$TPUSWARM_SKYRL_BUNDLE_URL" "$archive"
    tar -xzf "$archive" -C "$staging"
    test -r "$staging/tpu/swarm/run_v5p32_cell.sh"
    test -r "$staging/tpu/jobman/cell_worker.sh"
    test -r "$staging/tpu/jobman/ensure_orbax_ckpt.sh"
    mv "$staging" "$destination"
    rm -f -- "$archive"
    trap - EXIT
  fi
  ln -sfn "$destination" "$SKYRL_REPO_DIR"
  exec bash "$SKYRL_REPO_DIR/tpu/swarm/run_v5p32_cell.sh"
