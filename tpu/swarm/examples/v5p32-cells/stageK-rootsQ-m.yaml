name: stageK-rootsQ-m
# Stage K (2026-09-19): PAIRED-ROOTS gen-0 run. Row Q = the 16 initial constructions of stageC-pwc-n's
# step-0 tree, shared by all three models of the row (the origin run is the row's own-model member).
# Identical per-model config to stageG-m-rep1; differences: bundle v30 (LORA_SEED plumbed to tinker
# LoraConfig.seed), META_SEED_ONLY=1, LORA_SEED=1001. Fresh run: GCS_RUN holds only the staged step-0 tree.

# Stage G seed replication 1/2: muse piecewise LOO, lr 4e-5, 16x32 elite 2 (stageB-m-pw-n reached 0.380860445 @8).
# SAME config, SAME original prompt (no exemplars), bundle v23; a fresh independent draw of the
# random initial states (env.create_initial_state is unseeded). Question 1 of the Mixture-of-Models
# plan: is the gen-0 result reproducible across seeds, and what is the seed-to-seed spread that any
# cross-model delta must beat? Parent for the matched child generation stageH-m-on-q-rep1.
# piecewise_valid_entropic: A = (r - mean r) + alpha*(w - 1)*[valid]; GRPO carries validity,
# the one-bit entropic LOO weight ranks the valid cluster only (beta solved on that subset).
# One complete four-host tpu-v5p-32 slice from pool tpuswarm-v5p32-east5a-erdos:
# rank 0 = trainer + client + grader Ray head, ranks 1-3 = vLLM engines
# (cell_worker.sh per-model defaults; CELL prefix selects the model).
# Fresh run: the GCS_RUN below must not exist before launch (a reused GCS_RUN would RESUME).

resources:
  cloud: gcp
  region: us-east5
  zone: us-east5-a
  accelerators: tpu-v5p-32
  accelerator_args:
    gcp_queued_resource: true
    runtime_version: v2-alpha-tpuv5
  use_spot: true
  disk_size: 150
  job_recovery:
    strategy: FAILOVER
    max_restarts_on_errors: 3
    recover_on_exit_codes: [33, 34]

envs:
  PROJECT: vision-mix
  ZONE: us-east5-a
  REMOTE_USER: gcpuser
  SKYRL_REPO_DIR: /home/gcpuser/SkyRLTpu-tpuswarm
  TPUSWARM_SKYRL_BUNDLE_URL: gs://sk7524-tinker-tpu-us-east5/code-bundles/tpuswarm-skyrl-v5p32-cells-v30.tar.gz
  TPUSWARM_BUNDLE_ID: v5p32-cells-v30-stageK-rootsQ-m

  CELL: m-pw-n
  RUN_DIR_NAME: stageK-rootsQ-m
  EXPERIMENT_NAME: stageK-rootsQ-m
  GCS_RUN: gs://sk7524-tinker-tpu-us-east5/skyrl-runs/stageK-rootsQ-m
  # Stage K paired roots: the step-0 tree (16 random initial constructions of stageC-pwc-n, no PUCT
  # stats) was copied to this GCS_RUN before launch; the sampler resumes from step 0 and
  # META_SEED_ONLY keeps a cold tree from ever outranking it. Fresh base weights + LoRA.
  META_SEED_ONLY: "1"
  # Every rank installs the same bundle generation in `run`, so the head must
  # not rsync its worktree to the engine hosts (that SSH sync corrupted live).
  CELL_START_VLLM: "1"
  CELL_SYNC_SKYRL: "0"

  TTD_ENV: erdos_min_overlap
  TTD_ADV_ESTIMATOR: piecewise_valid_entropic
  TTD_ELITE_SLOTS: "2"
  GROUPS_PER_BATCH: "16"
  GROUP_SIZE: "32"
  NUM_EPOCHS: "15"
  LEARNING_RATE: "4e-5"
  LORA_RANK: "32"
  KL_PENALTY_COEF: "0"
  TTD_RESTART_RATIO: "0"
  TTD_CROSS_WEIGHT: "0"
  TTD_KL_MEASURE_EVERY: "0"
  TTD_LEAGUE_PIPELINE: "1"
  TTD_ALLOW_SINGLE_MEMBER: "1"
  TTD_SAMPLING_PROGRESS_TIMEOUT: "0"
  EVAL_TIMEOUT: "1100"
  WANDB_MODE: offline

  MONITOR_INTERVAL_SECONDS: "30"
  SYNC_EVERY_SECONDS: "300"
  TINKER_FAILURE_LIMIT: "4"
  # The local SkyRL Tinker-compatible API is unauthenticated; the upstream
  # client only requires the variable to be nonempty. Passed explicitly into
  # the tmux command because a reused tmux server keeps its creator's env.
  TINKER_API_KEY: tml-local-skyrl-no-auth
  TINKER_BASE_URL: http://127.0.0.1:8000
  # LORA_SEED: fixed adapter-init seed (bundle v30), one value per roots row.
  EXTRA_TTD_ENV: TINKER_API_KEY=tml-local-skyrl-no-auth TTD_ADV_PIECEWISE_ALPHA=1.0 LORA_SEED=1001

run: |
  set -euo pipefail
  export PATH="$HOME/.local/bin:$PATH"
  generation=$(gcloud storage objects describe "$TPUSWARM_SKYRL_BUNDLE_URL" \
    --format='value(generation)')
  test -n "$generation"
  bundles="$HOME/.cache/tpuswarm/bundles"
  destination="$bundles/$generation"
  mkdir -p "$bundles"
  if [ ! -d "$destination" ]; then
    archive=$(mktemp /tmp/tpuswarm-skyrl.XXXXXX.tar.gz)
    staging=$(mktemp -d "$bundles/.extract.XXXXXX")
    trap 'rm -f -- "$archive"; rm -rf -- "$staging"' EXIT
    gcloud storage cp "$TPUSWARM_SKYRL_BUNDLE_URL" "$archive"
    tar -xzf "$archive" -C "$staging"
    test -r "$staging/tpu/swarm/run_v5p32_cell.sh"
    test -r "$staging/tpu/jobman/cell_worker.sh"
    test -r "$staging/tpu/jobman/ensure_orbax_ckpt.sh"
    mv "$staging" "$destination"
    rm -f -- "$archive"
    trap - EXIT
  fi
  ln -sfn "$destination" "$SKYRL_REPO_DIR"
  exec bash "$SKYRL_REPO_DIR/tpu/swarm/run_v5p32_cell.sh"
