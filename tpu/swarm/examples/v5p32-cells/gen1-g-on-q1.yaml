name: gen1-g-on-q1

# Stage G seed replication 1/2: gemma centered piecewise, lr 4e-5, 16x32 elite 2
# (stageB2-g-pwc-n reached 0.380863427 @12). SAME config, SAME original prompt (no exemplars),
# bundle v23; a fresh independent draw of the random initial states. Mixture-of-Models question 1:
# what is the seed-to-seed spread any transfer effect has to beat?
# piecewise_valid_entropic_centered: A = (r - mean r) + alpha*(w - 1)*[valid]; GRPO carries validity,
# w = exp(beta r) / mean_valid exp(beta r): the ranking term averages to ZERO over the valid
# cluster (zero-sum comparison among working programs); one-bit beta solved on that subset.
# One complete four-host tpu-v5p-32 slice from pool tpuswarm-v5p32-east5a-erdos:
# rank 0 = trainer + client + grader Ray head, ranks 1-3 = vLLM engines
# (cell_worker.sh per-model defaults; CELL prefix selects the model).
# Fresh run: GCS_RUN must not exist before launch (a reused GCS_RUN would RESUME).

resources:
  cloud: gcp
  region: us-east5
  zone: us-east5-a
  accelerators: tpu-v5p-32
  accelerator_args:
    gcp_queued_resource: true
    runtime_version: v2-alpha-tpuv5
  use_spot: true
  disk_size: 150
  job_recovery:
    strategy: FAILOVER
    max_restarts_on_errors: 3
    recover_on_exit_codes: [33, 34]

envs:
  PROJECT: vision-mix
  ZONE: us-east5-a
  REMOTE_USER: gcpuser
  SKYRL_REPO_DIR: /home/gcpuser/SkyRLTpu-tpuswarm
  TPUSWARM_SKYRL_BUNDLE_URL: gs://sk7524-tinker-tpu-us-east5/code-bundles/tpuswarm-skyrl-v5p32-cells-v23.tar.gz
  TPUSWARM_BUNDLE_ID: v5p32-cells-v23-gen1-g-on-q1

  # Trainer fb program needs 51.00 GB scratch vs 50.81 GB free per chip on this
  # runtime (job 189, 2026-09-05). Free the duplicate base-weight copy after the
  # LoRA template is built (RUNBOOK 4.4: ~35 GiB, memory-only).
  TUNIX_FREE_BASE_STATE: "1"

  CELL: g-pwc-n
  RUN_DIR_NAME: gen1-g-on-q1
  EXPERIMENT_NAME: gen1-g-on-q1
  GCS_RUN: gs://sk7524-tinker-tpu-us-east5/skyrl-runs/gen1-g-on-q1
  # Every rank installs the same bundle generation in `run`, so the head must
  # not rsync its worktree to the engine hosts (that SSH sync corrupted live).
  CELL_START_VLLM: "1"
  CELL_SYNC_SKYRL: "0"

  # Seeded generation: the staged step-0 seed is the ONLY legitimate snapshot while nothing is
  # banked (launch_cell.sh META_SEED_ONLY guard). Weights only: fresh optimizer.
  META_SEED_ONLY: "1"
  # Step 15 by NUMBER: launch_cell.sh restores carried tarballs via tinker://model_x/weights/(\d+), so the
  # registry alias "weights/final" (the same batch-15 weights) is never restored and the cell crashes (job 912).
  META_INIT_STATE_PATH: tinker://model_1062a2d1/weights/000015

  TTD_ENV: erdos_min_overlap
  TTD_ADV_ESTIMATOR: piecewise_valid_entropic_centered
  TTD_ELITE_SLOTS: "2"
  GROUPS_PER_BATCH: "16"
  GROUP_SIZE: "32"
  NUM_EPOCHS: "15"
  LEARNING_RATE: "4e-5"
  LORA_RANK: "32"
  KL_PENALTY_COEF: "0"
  TTD_RESTART_RATIO: "0"
  TTD_CROSS_WEIGHT: "0"
  TTD_KL_MEASURE_EVERY: "0"
  TTD_LEAGUE_PIPELINE: "1"
  TTD_ALLOW_SINGLE_MEMBER: "1"
  TTD_SAMPLING_PROGRESS_TIMEOUT: "0"
  EVAL_TIMEOUT: "1100"
  WANDB_MODE: offline

  MONITOR_INTERVAL_SECONDS: "30"
  SYNC_EVERY_SECONDS: "300"
  TINKER_FAILURE_LIMIT: "4"
  # The local SkyRL Tinker-compatible API is unauthenticated; the upstream
  # client only requires the variable to be nonempty. Passed explicitly into
  # the tmux command because a reused tmux server keeps its creator's env.
  TINKER_API_KEY: tml-local-skyrl-no-auth
  TINKER_BASE_URL: http://127.0.0.1:8000
  EXTRA_TTD_ENV: TINKER_API_KEY=tml-local-skyrl-no-auth TTD_ADV_PIECEWISE_ALPHA=1.0

run: |
  set -euo pipefail
  export PATH="$HOME/.local/bin:$PATH"
  generation=$(gcloud storage objects describe "$TPUSWARM_SKYRL_BUNDLE_URL" \
    --format='value(generation)')
  test -n "$generation"
  bundles="$HOME/.cache/tpuswarm/bundles"
  destination="$bundles/$generation"
  mkdir -p "$bundles"
  if [ ! -d "$destination" ]; then
    archive=$(mktemp /tmp/tpuswarm-skyrl.XXXXXX.tar.gz)
    staging=$(mktemp -d "$bundles/.extract.XXXXXX")
    trap 'rm -f -- "$archive"; rm -rf -- "$staging"' EXIT
    gcloud storage cp "$TPUSWARM_SKYRL_BUNDLE_URL" "$archive"
    tar -xzf "$archive" -C "$staging"
    test -r "$staging/tpu/swarm/run_v5p32_cell.sh"
    test -r "$staging/tpu/jobman/cell_worker.sh"
    test -r "$staging/tpu/jobman/ensure_orbax_ckpt.sh"
    mv "$staging" "$destination"
    rm -f -- "$archive"
    trap - EXIT
  fi
  ln -sfn "$destination" "$SKYRL_REPO_DIR"
  exec bash "$SKYRL_REPO_DIR/tpu/swarm/run_v5p32_cell.sh"
