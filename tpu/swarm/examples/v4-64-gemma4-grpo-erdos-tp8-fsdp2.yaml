name: gemma4-v4-64-grpo-erdos-tp8-fsdp2-001

resources:
  cloud: gcp
  region: us-central2
  zone: us-central2-b
  accelerators: tpu-v4-64
  accelerator_args:
    gcp_queued_resource: true
    runtime_version: tpu-ubuntu2204-base
  use_spot: true
  disk_size: 300
  job_recovery:
    strategy: FAILOVER
    max_restarts_on_errors: 3
    recover_on_exit_codes: [33, 34]

envs:
  PROJECT: vision-mix
  ZONE: us-central2-b
  REMOTE_USER: gcpuser
  SKYRL_REPO_DIR: /home/gcpuser/SkyRLTpu-tpuswarm
  TPUSWARM_SKYRL_BUNDLE_URL: gs://sk7524-tinker-tpu-us-central2/code-bundles/tpuswarm-skyrl-v4-mixed-v41.tar.gz
  TPUSWARM_BUNDLE_ID: v41-gemma4-v4-64-tp8-fsdp2-r32-s22528-b45056-s16-u090

  # Match the running Qwen GRPO/Erdos arm except for model-specific learning
  # rate, renderer, weights, caches, and the measured Gemma serving settings.
  CELL: g-grpo-n
  RUN_DIR_NAME: v4-64-gemma4-grpo-erdos-tp8-fsdp2-001
  EXPERIMENT_NAME: v4-64-gemma4-grpo-erdos-tp8-fsdp2-001
  TTD_ENV: erdos_min_overlap
  TTD_ADV_ESTIMATOR: mean_baseline
  TTD_ELITE_SLOTS: "2"
  GROUPS_PER_BATCH: "16"
  GROUP_SIZE: "32"
  NUM_EPOCHS: "15"
  LEARNING_RATE: "4e-5"
  LORA_RANK: "32"
  KL_PENALTY_COEF: "0"
  TTD_RESTART_RATIO: "0"
  TTD_CROSS_WEIGHT: "0"
  TTD_KL_MEASURE_EVERY: "0"
  TTD_LEAGUE_PIPELINE: "1"
  TTD_ALLOW_SINGLE_MEMBER: "1"
  TTD_SAMPLING_PROGRESS_TIMEOUT: "0"
  CONTEXT_WINDOW: "22528"
  PHASE1_MAX_TOKENS: "13824"
  TTD_TRAIN_MAX_SEQ: "22528"
  EVAL_TIMEOUT: "1100"
  WANDB_MODE: offline

  MODEL_NAME: google/gemma-4-31B-it
  TUNIX_MAXTEXT_MODEL_NAME: gemma4-31b
  TUNIX_MAXTEXT_PIP_SPEC: maxtext @ git+https://github.com/SachinKonan/maxtext.git@0fd409939977ac0ab79a4e64d21730936f253567
  V4_64_AUTO_TOPOLOGY: "1"
  TRAIN_TP_SIZE: "8"
  TRAIN_FSDP_SIZE: "2"
  TUNIX_ROW_SHARD: "2"
  TRAIN_TPU_PROCESS_BOUNDS: 1,1,4
  TRAIN_TPU_CHIPS_PER_PROCESS_BOUNDS: 2,2,1
  TUNIX_LORA_RANK: "32"
  TUNIX_MAX_TARGET_LENGTH: "22528"
  TUNIX_UNIFORM_SEQ_LEN: "22528"
  TUNIX_TRAIN_TOKEN_BUDGET: "45056"
  TUNIX_FREE_BASE_STATE: "1"
  TUNIX_MAXTEXT_CKPT_CACHE_GCS: gs://sk7524-tinker-tpu-us-central2/skyrl-maxtext-ckpts
  TUNIX_JAX_CACHE_LOCAL: /home/gcpuser/jax-cache-v4-gemma4-tp8-fsdp2-r32-s22528-b45056-v1
  TUNIX_JAX_CACHE_GCS: gs://sk7524-tinker-tpu-us-central2/jax-compile-cache-v4-gemma4-tp8-fsdp2-r32-s22528-b45056-v1

  CELL_START_VLLM: "1"
  CELL_SYNC_SKYRL: "0"
  VLLM_TP_SIZE: "4"
  VLLM_ENGINES_PER_HOST: "1"
  VLLM_MAX_MODEL_LEN: "22528"
  VLLM_MAX_NUM_SEQS: "16"
  VLLM_ENABLE_LORA: "1"
  VLLM_MAX_LORA_RANK: "32"
  VLLM_RAY_EXECUTOR: "0"
  VLLM_CLIENT_SIDE_ROUND_ROBIN: "1"
  VLLM_TPU_PROCESS_BOUNDS: 1,1,1
  VLLM_TPU_CHIPS_PER_PROCESS_BOUNDS: 2,2,1
  VLLM_SKIP_JAX_PRECOMPILE: "0"
  VLLM_USE_BATCHED_RPA_KERNEL: "0"
  VLLM_USE_JAX_RAGGED_CONV1D: "0"
  VLLM_LORA_LOAD_RETRIES: "20"
  VLLM_LORA_LOAD_RETRY_SLEEP_SEC: "30"
  VLLM_REQUEST_TIMEOUT_SEC: "1800"
  EXTERNAL_INFERENCE_TIMEOUT_SEC: "21600"
  SKYRL_EXTERNAL_WATCHDOG_INFLIGHT_SEC: "0"
  SKYRL_EXTERNAL_WATCHDOG_ABANDON_SEC: "28800"
  SKYRL_EXTERNAL_WATCHDOG_STALE_SEC: "30"
  SKYRL_EXTERNAL_WATCHDOG_MAX_REDISPATCH: "4"
  VLLM_INPLACE_RESTART_LIMIT: "2"
  VLLM_RESTART_READY_ATTEMPTS: "120"
  VLLM_RESTART_READY_INTERVAL_SECONDS: "15"
  VLLM_EXTRA_ARGS: --max-num-batched-tokens 1024 --enable-chunked-prefill --disable-chunked-mm-input --gpu-memory-utilization 0.90
  VLLM_LIMIT_MM_PER_PROMPT: '{"image":0,"audio":0,"video":0}'
  HF_HUB_OFFLINE: "1"
  HF_CACHE_GCS: gs://sk7524-tinker-tpu-us-central2/hf-cache-gemma4-v1
  VLLM_XLA_CACHE_GCS: gs://sk7524-tinker-tpu-us-central2/vllm-xla-cache-gemma4-v4-32-tp4-s22528-chunk1024-rpav3-v4-sweep-v1

  GCS_RUN: gs://sk7524-tinker-tpu-us-central2/skyrl-runs/v4-64-gemma4-grpo-erdos-tp8-fsdp2-001
  SKYRL_CKPT_GCS: gs://sk7524-tinker-tpu-us-central2/skyrl-checkpoints
  GRADER_RAY_PORT: "6379"
  MONITOR_INTERVAL_SECONDS: "30"
  SYNC_EVERY_SECONDS: "300"
  TINKER_FAILURE_LIMIT: "4"
  TINKER_API_KEY: tml-local-skyrl-no-auth
  TINKER_BASE_URL: http://127.0.0.1:8000
  EXTRA_TTD_ENV: TINKER_API_KEY=tml-local-skyrl-no-auth

run: |
  set -euo pipefail
  export PATH="$HOME/.local/bin:$PATH"
  generation=$(gcloud storage objects describe "$TPUSWARM_SKYRL_BUNDLE_URL" \
    --format='value(generation)')
  test -n "$generation"
  bundles="$HOME/.cache/tpuswarm/bundles"
  destination="$bundles/$generation"
  mkdir -p "$bundles"
  if [ ! -d "$destination" ]; then
    archive=$(mktemp /tmp/tpuswarm-skyrl.XXXXXX.tar.gz)
    staging=$(mktemp -d "$bundles/.extract.XXXXXX")
    trap 'rm -f -- "$archive"; rm -rf -- "$staging"' EXIT
    gcloud storage cp "$TPUSWARM_SKYRL_BUNDLE_URL" "$archive"
    tar -xzf "$archive" -C "$staging"
    test -r "$staging/tpu/swarm/run_qwen35_v4_64_grpo.sh"
    test -r "$staging/tpu/swarm/discover_v4_64_topology.sh"
    test -r "$staging/tpu/swarm/reconcile_v4_64_role_caches.sh"
    test -r "$staging/tpu/swarm/reconcile_v4_64_host_role.sh"
    test -r "$staging/tpu/swarm/cleanup_v4_64_worker.sh"
    test -r "$staging/tpu/swarm/prune_hf_weight_cache.py"
    test -r "$staging/tpu/swarm/stage_hf_metadata_cache.py"
    test -r "$staging/tpu/dedupe_hf_snapshot.sh"
    test -r "$staging/tpu/gcs_rsync.sh"
    test -r "$staging/tpu/launch_cell.sh"
    test -r "$staging/tpu/jobman/cell_sync.sh"
    test -r "$staging/tpu/jobman/cell_monitor.sh"
    mv "$staging" "$destination"
    rm -f -- "$archive"
    trap - EXIT
  fi
  ln -sfn "$destination" "$SKYRL_REPO_DIR"
  topology_venv="$HOME/.venvs/tpu-topology"
  if [ ! -x "$topology_venv/bin/python" ]; then
    UV_NO_CONFIG=1 uv venv "$topology_venv" --python 3.12
  fi
  UV_NO_CONFIG=1 uv pip install --python "$topology_venv/bin/python" \
    'jax==0.11.1' 'jaxlib==0.11.1' 'libtpu==0.0.46' 'requests==2.32.5'
  exec bash "$SKYRL_REPO_DIR/tpu/swarm/run_qwen35_v4_64_grpo.sh"
