run: "set -euo pipefail\nexport PATH=\"$HOME/.local/bin:$PATH\"\ncode=\"$HOME/.cache/skyrl-ray-code/$RAY_TRAIN_CODE_SHA256\"\
  \nif [ ! -f \"$code/.complete\" ]; then\n  mkdir -p \"$code\"\n  gcloud storage\
  \ cp \"$RAY_TRAIN_CODE\" \"$code/code.tar.gz\"\n  printf '%s  %s\\n' \"$RAY_TRAIN_CODE_SHA256\"\
  \ \"$code/code.tar.gz\" | sha256sum -c -\n  tar -xzf \"$code/code.tar.gz\" -C \"\
  $code\"\n  touch \"$code/.complete\"\nfi\nexport PYTHONPATH=\"$code:$code/tpu${PYTHONPATH:+:$PYTHONPATH}\"\
  \nexec python3 -m tpu.swarm.ray_train.bootstrap \"$code/tpu/swarm/ray_train/profiles/farm10-muse-1-20260921-10step-deployment.json\"\
  \n"
