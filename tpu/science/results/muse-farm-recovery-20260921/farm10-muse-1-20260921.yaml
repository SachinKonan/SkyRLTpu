name: farm10-muse-1-20260921
resources:
  cloud: gcp
  zone: us-central2-b
  accelerators: tpu-v4-32
  accelerator_args:
    gcp_queued_resource: true
    runtime_version: tpu-ubuntu2204-base
  use_spot: true
  disk_size: 300
  job_recovery:
    strategy: FAILOVER
    max_restarts_on_errors: 3
  priority: 120
envs:
  RAY_TRAIN_CODE: gs://sk7524-tinker-tpu-us-central2/code-bundles/ray-training-b5c2aab680c39031fd5d3cd36ed39cbcd31c7d7b680086674c9d7fef16cffac6.tar.gz
