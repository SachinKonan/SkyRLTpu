command:
  cmd: 'set -euo pipefail

    export PATH="$HOME/.local/bin:$PATH"

    bash "$HOME/SkyRLTpu-league/tpu/jobman/cell_worker.sh"

    '
  workers: all
gcsfuse:
  bucket_name: sk7524-tinker-tpu-us-east5
  mount_path: /home/sk7524_princeton_edu/gcs
job:
  env_type: null
  loop: true
  name: sk7524-stagea-g-tsw-n
  remote_user: sk7524_princeton_edu
  worker_num: auto
resumable:
  completion_probe:
    command: 'bash "$HOME/SkyRLTpu-league/tpu/jobman/cell_probe.sh"

      '
    timeout: 120
    workers: 0
  enabled: true
  env:
    CELL: g-tsw-n
    EXPERIMENT_NAME: stageC-g-tsw-n
    GROUPS_PER_BATCH: '16'
    GROUP_SIZE: '32'
    KL_PENALTY_COEF: '0'
    NUM_EPOCHS: '15'
    RUN_DIR_NAME: stageC-g-tsw-n
    SKYRLTPU_BUNDLE_URL: gs://sk7524-tinker-tpu-us-east5/code-bundles/stagea-league.tar.gz
    TTD_ADV_ESTIMATOR: mean_baseline
    TTD_ELITE_SLOTS: '2'
    TTD_ENV: erdos_min_overlap
    TTD_RESTART_RATIO: '0'
  lease:
    poll_seconds: 30
    type: local
  local_cache_root: /n/fs/vision-mix/sk7524/jobman-runs
  monitor:
    command: 'export PATH="$HOME/.local/bin:$PATH"

      bash "$HOME/SkyRLTpu-league/tpu/jobman/cell_monitor.sh"

      '
    timeout: 0
    workers: 0
  prepare:
    command: "set -euxo pipefail\nwait_for_apt() {\n  local waited=0\n  while sudo fuser /var/lib/dpkg/lock-frontend /var/lib/dpkg/lock /var/cache/apt/archives/lock >/dev/null 2>&1; do\n    (( waited >= 600 )) && return 1\n    sleep 5; waited=$((waited + 5))\n  done\n}\n# Skip apt entirely once everything is present: prepare re-runs on EVERY\n# loop iteration, and unattended-upgrades holding the dpkg lock 10+ min\n# (seen live on grpo-k w2) must not fail an otherwise-healthy retry.\nif ! { command -v git && command -v tmux && command -v g++; } >/dev/null 2>&1; then\n  wait_for_apt; sudo apt-get update -y\n  wait_for_apt; sudo DEBIAN_FRONTEND=noninteractive apt-get install -y git curl tmux python3 python3-venv python3-pip build-essential\nfi\ncommand -v uv >/dev/null 2>&1 || curl -LsSf https://astral.sh/uv/install.sh | sh\nexport PATH=\"$HOME/.local/bin:$PATH\"\nmkdir -p \"$HOME/gcs/skyrl-checkpoints\" \"$HOME/skyrl-runs\" \"$HOME/skyrl-logs\"\n# Unpack the league code bundle when absent or stale. Staleness and the\n# copy go through gsutil, NOT the gcsfuse mount: fuse attribute caching\n# served a same-path re-upload's OLD size for its TTL, so prepare saw\n# \"unchanged\", skipped the unpack, and hosts rebuilt engines from stale\n# code (bit the tile-fix rollout live).\nBUNDLE_URL=\"gs://sk7524-tinker-tpu-us-east5/code-bundles/stagea-league.tar.gz\"\nDEST=\"$HOME/SkyRLTpu-league\"\nwant=$(gsutil stat \"$BUNDLE_URL\" | awk '/Content-Length/ {print $2}')\ntest -n \"$want\"\nhave=$(cat \"$DEST/.bundle-size\" 2>/dev/null || echo none)\nif [ \"$want\" != \"$have\" ]; then\n  gsutil -q cp \"$BUNDLE_URL\" /tmp/stagea-bundle.tar.gz\n  rm -rf \"$DEST.new\"; mkdir -p \"$DEST.new\"\n  tar -xzf /tmp/stagea-bundle.tar.gz -C \"$DEST.new\"\n  test -x \"$DEST.new/tpu/jobman/cell_worker.sh\"\n  test -f \"$DEST.new/third_party/discover/.env\"\n  echo \"$want\" > \"$DEST.new/.bundle-size\"\n  rm -rf \"$DEST.old\"; [ -d \"$DEST\" ] && mv \"$DEST\" \"$DEST.old\" || true\n  mv \"$DEST.new\" \"$DEST\"\nfi\n# Make the trainer's orbax checkpoint valid BEFORE any engine starts: a\n# torn restore otherwise surfaces as DATA_LOSS inside the trainer, or as\n# RESOURCE_EXHAUSTED when the backend silently falls back to converting\n# from HF on a disk that cannot hold both. Worker 0 only; no-ops elsewhere.\nTUNIX_MAXTEXT_MODEL_NAME=\"${TUNIX_MAXTEXT_MODEL_NAME:-}\" MODEL_NAME=\"${MODEL_NAME:-}\" \\\n  bash \"$DEST/tpu/jobman/ensure_orbax_ckpt.sh\" || true\n"
    timeout: 0
    workers: all
  remote_gcs_cache_root: /home/sk7524_princeton_edu/gcs/jobman-runs
  remote_local_cache_root: /tmp/jobman-runs
  retry_sleep_seconds: 60
  run_id: auto
  run_id_prefix: stagea-g-tsw-n
  run_spec:
    batch_shape: 16x32
    cell: g-tsw-n
    elite_slots: 2
    experiment: stage-a-regularization
    kl_penalty_coef: 0
    objective: mean_baseline
    problem: erdos
    restart_ratio: 0
    steps: 15
  sync:
    command: 'bash "$HOME/SkyRLTpu-league/tpu/jobman/cell_sync.sh"

      '
    timeout: 600
    workers: 0
ssh:
  identities:
  - config_entry: "Host 10.* 34.* 35.* 8.* 104.* 136.*\n  IdentityFile ~/.ssh/jobman_tpu_ed25519\n  IdentitiesOnly yes\n  StrictHostKeyChecking no\n  UserKnownHostsFile /dev/null\n"
    private_key: ~/.ssh/jobman_tpu_ed25519
    public_key: ~/.ssh/jobman_tpu_ed25519.pub
  private_key: ~/.ssh/jobman_tpu_ed25519
tpu:
  accelerator: v5p-32
  allocation_mode: queued-resources
  flags:
  - --project=vision-mix
  name: sk7524-stagea-g-tsw-n
  pricing: spot
  version: v2-alpha-tpuv5
  zone: us-east5-a
