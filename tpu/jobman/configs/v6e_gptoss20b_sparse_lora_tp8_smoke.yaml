job:
  name: sk7524-v6e8-gptoss20b-sparse-lora-smoke-south1
  env_type: null
  loop: true
  remote_user: sk7524_princeton_edu
  worker_num: auto

tpu:
  allocation_mode: "queued-resources"
  accelerator: v6e-8
  name: sk7524-v6e8-gptoss20b-sparse-lora-smoke-south1
  zone: us-south1-a
  version: v2-alpha-tpuv6e
  pricing: spot
  flags:
    - "--project=vision-mix"

gcsfuse:
  bucket_name: sk7524-tinker-tpu-us-south1
  mount_path: /home/sk7524_princeton_edu/gcs

ssh:
  private_key: ~/.ssh/jobman_tpu_ed25519
  identities:
    - private_key: ~/.ssh/jobman_tpu_ed25519
      public_key: ~/.ssh/jobman_tpu_ed25519.pub
      config_entry: |
        Host 10.* 34.* 35.* 8.* 104.* 136.*
          IdentityFile ~/.ssh/jobman_tpu_ed25519
          IdentitiesOnly yes
          StrictHostKeyChecking no
          UserKnownHostsFile /dev/null

resumable:
  enabled: true
  run_id: auto
  run_id_prefix: v6e8-gptoss20b-sparse-lora-tp8-s256-r32-south1-v1
  local_cache_root: /n/fs/vision-mix/sk7524/jobman-runs
  remote_gcs_cache_root: /home/sk7524_princeton_edu/gcs/jobman-runs
  remote_local_cache_root: /tmp/jobman-runs
  retry_sleep_seconds: 60
  lease:
    type: local
    poll_seconds: 30
  run_spec:
    experiment: gptoss20b-sparse-lora-v6e8-compile
    model: gpt-oss-20b
    topology: tp8
    global_batch: 1
    trainer_token_budget: 256
    uniform_sequence_length: 256
    lora_rank: 32
    sparse_matmul: true
    megablox: true
    consecutive_updates: 2
    checkpoint_replays: 1
  env:
    PROJECT: vision-mix
    ZONE: us-south1-a
    SKYRL_REPO_DIR: /home/sk7524_princeton_edu/SkyRLTpu-v6e
    SKYRLTPU_BUNDLE_URL: gs://sk7524-tinker-tpu-us-south1/code-bundles/gptoss20b-sparse-lora-v6e8-8aa3c1e6.tar.gz
    SKYRLTPU_BUNDLE_SHA256: f40e1b9fb01cb81aafb236a8cf2412c7a25fd1aa366a30e8abc4746431b440e5
    MODEL_NAME: openai/gpt-oss-20b
    TUNIX_MAXTEXT_MODEL_NAME: gpt-oss-20b
    TUNIX_MAXTEXT_PIP_SPEC: "maxtext @ git+https://github.com/SachinKonan/maxtext.git@b77f9f358a1dd9b223fcc16792b7d5c2530d7044"
    TUNIX_MAXTEXT_KWARGS: '{"sparse_matmul":true,"megablox":true,"num_vocab_tiling":64,"remat_policy":"full","allow_split_physical_axes":true}'
    TRAIN_WORKERS: "0"
    VLLM_WORKERS: ""
    TRAIN_TP_SIZE: "8"
    TRAIN_FSDP_SIZE: "1"
    TUNIX_ROW_SHARD: "1"
    TRAIN_TPU_PROCESS_BOUNDS: "1,1,1"
    TRAIN_TPU_CHIPS_PER_PROCESS_BOUNDS: "2,2,2"
    TUNIX_LORA_RANK: "32"
    TUNIX_SMOKE_ROWS: "1"
    TUNIX_SMOKE_REPLAYS: "1"
    TUNIX_SMOKE_EXTRA_UPDATES: "1"
    TUNIX_REPLAY_DIAGNOSTICS: "1"
    TUNIX_REQUIRE_SPARSE_EXPERT_GRADIENTS: "1"
    TUNIX_FREE_BASE_STATE: "1"
    TUNIX_UNIFORM_SEQ_LEN: "256"
    TUNIX_TRAIN_TOKEN_BUDGET: "256"
    TUNIX_FLCE_TILE_SIZE: "512"
    TUNIX_JAX_CACHE_GCS: gs://sk7524-tinker-tpu-us-south1/jax-compile-cache-v6e8-gptoss20b-sparse-lora-tp8-r32-s256-v1
    TUNIX_JAX_CACHE_LOCAL: /home/sk7524_princeton_edu/jax_cache_v6e8_gptoss20b_sparse_lora_tp8_r32_s256_v1
    TUNIX_MAXTEXT_CKPT_CACHE_GCS: gs://sk7524-tinker-tpu-us-south1/skyrl-maxtext-ckpts
    SMOKE_RESULT_GCS: gs://sk7524-tinker-tpu-us-south1/v6e-smoke-results/gptoss20b-sparse-lora-v6e8-tp8-r32-s256-v1.json
  prepare:
    workers: all
    timeout: 0
    command: |
      set -euxo pipefail
      wait_for_apt() {
        local waited=0
        while sudo fuser /var/lib/dpkg/lock-frontend /var/lib/dpkg/lock /var/cache/apt/archives/lock >/dev/null 2>&1; do
          (( waited >= 600 )) && return 1
          sleep 5; waited=$((waited + 5))
        done
      }
      if ! { command -v git && command -v tmux && command -v g++; } >/dev/null 2>&1; then
        wait_for_apt; sudo apt-get update -y
        wait_for_apt; sudo DEBIAN_FRONTEND=noninteractive apt-get install -y git curl tmux python3 python3-venv python3-pip build-essential
      fi
      command -v uv >/dev/null 2>&1 || curl -LsSf https://astral.sh/uv/install.sh | sh
      export PATH="$HOME/.local/bin:$PATH"
      DEST="$HOME/SkyRLTpu-v6e"
      BUNDLE_URL="$SKYRLTPU_BUNDLE_URL"
      want="$SKYRLTPU_BUNDLE_SHA256"
      test -n "$want"
      have=$(cat "$DEST/.bundle-sha256" 2>/dev/null || echo none)
      if [ "$want" != "$have" ]; then
        gsutil -q cp "$BUNDLE_URL" /tmp/tunix-v6e-bundle.tar.gz
        echo "$want  /tmp/tunix-v6e-bundle.tar.gz" | sha256sum -c -
        rm -rf "$DEST.new"; mkdir -p "$DEST.new"
        tar -xzf /tmp/tunix-v6e-bundle.tar.gz -C "$DEST.new"
        test -x "$DEST.new/tpu/jobman/v6e_tunix_smoke_worker.sh"
        echo "$want" > "$DEST.new/.bundle-sha256"
        rm -rf "$DEST.old"; [ -d "$DEST" ] && mv "$DEST" "$DEST.old" || true
        mv "$DEST.new" "$DEST"
      fi
      mkdir -p "$HOME/gcs/skyrl-checkpoints" "$HOME/skyrl-logs"
      bash "$DEST/tpu/jobman/ensure_orbax_ckpt.sh"
  completion_probe:
    workers: 0
    timeout: 120
    command: |
      gcloud storage objects describe "$SMOKE_RESULT_GCS" >/dev/null 2>&1

command:
  cmd: |
    set -euo pipefail
    export PATH="$HOME/.local/bin:$PATH"
    bash "$HOME/SkyRLTpu-v6e/tpu/jobman/v6e_tunix_smoke_worker.sh"
  workers: "all"
